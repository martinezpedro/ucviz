# Native dark theme so ALL Streamlit widgets (sidebar filters, dropdowns,
# sliders, inputs, data editor) render dark and readable — not just the page
# background. Custom accent CSS in modules/ui.py layers on top of this.
[theme]
base = "dark"
primaryColor = "#4fc3f7"
backgroundColor = "#1a1a2e"
secondaryBackgroundColor = "#16213e"
textColor = "#e6e9f2"
linkColor = "#4fc3f7"
font = "sans serif"
